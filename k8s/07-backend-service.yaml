apiVersion: v1
kind: Service
metadata:
  name: backend    # nom du service
  namespace: bijouterie
  labels:
    app: bijouterie
    tier: backend
spec:
  type: ClusterIP
  selector:
    app: bijouterie
    tier: backend
  ports:
    - port: 3000
      targetPort: 3000   #port du conteneur exposé par le service 
