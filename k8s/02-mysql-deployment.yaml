apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-deployment   # nom du déploiement
  namespace: bijouterie
  labels:
    app: bijouterie
    tier: database
spec:
  replicas: 1   # nombre de réplicas du déploiement
  strategy:
    type: Recreate   # stratégie de déploiement
  selector:
    matchLabels:      # labels pour sélectionner les pods gérés par ce déploiement
      app: bijouterie
      tier: database
  template:         # modèle de pod pour le déploiement
    metadata:
      labels:
        app: bijouterie
        tier: database
    spec:      # spécification du pod
      containers:
      - name: mysql
        image: fallougaye/bijouterie-mysql:20
        ports:
          - containerPort: 3306
        envFrom:      # récupère les variables d'environnement à partir du secret
          - secretRef:
              name: mysql-secret
        resources:     # spécifie les ressources allouées au conteneur
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        volumeMounts:   # monte le volume persistant dans le conteneur
          - name: mysql-data    # monte le volume persistant pour les données de la base de données
            mountPath: /var/lib/mysql
          - name: mysql-init   # monte le volume pour le script d'initialisation de la base de données
            mountPath: /docker-entrypoint-initdb.d
            readOnly: true
      volumes:   # définit le volume persistant pour le pod
        - name: mysql-data    # définit le volume persistant pour les données de la base de données
          persistentVolumeClaim:
            claimName: mysql-pvc
        - name: mysql-init    # définit le volume pour le script d'initialisation de la base de données
          configMap:
            name: mysql-init
