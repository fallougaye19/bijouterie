apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-deployment   # nom du déploiement
  namespace: bijouterie
  labels:
    app: bijouterie
    tier: database
spec:
  replicas: 1   # nombre de réplicas du déploiement
  selector:
    matchLabels:      # labels pour sélectionner les pods gérés par ce déploiement
      app: bijouterie
      tier: database
  template:         # modèle de pod pour le déploiement
    metadata:
      labels:
        app: bijouterie
        tier: database
    spec:      # spécification du pod
      containers:
      - name: mysql
        image: fallougaye/bijouterie-mysql:1   
        ports:
          - containerPort: 3306
        envFrom:      # récupère les variables d'environnement à partir du secret
          - secretRef:
              name: mysql-secret
        resources:     # spécifie les ressources allouées au conteneur
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
