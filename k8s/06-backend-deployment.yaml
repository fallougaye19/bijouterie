apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: bijouterie
  labels:
    app: bijouterie
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bijouterie
      tier: backend
  template:
    metadata:
      labels:
        app: bijouterie
        tier: backend
    spec:
      containers:
        - name: backend-container
          image: fallougaye/bijouterie-backend:1
          ports:
            - containerPort: 3000
          envFrom:     # récupère les variables d'environnement à partir du configMap
            - configMapRef:
                name: backend-config
          env:      # récupère les variables d'environnement à partir du secret
            - name: DB_USER
              valueFrom: # récupère la valeur de la variable d'environnement à partir du secret
                secretKeyRef:
                  name: backend-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DB_PASSWORD
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          livenessProbe: # vérifie si le conteneur est vivant et redémarre le conteneur si la sonde échoue
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10 # délai avant la première vérification de l'état du conteneur
            periodSeconds: 10 # intervalle entre les vérifications de l'état du conteneur
          readinessProbe: # vérifie si le conteneur est prêt à recevoir du trafic et ne le marque pas comme prêt tant que la sonde échoue
            httpGet:
              path: /api/ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
