apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret    # nom du secret
  namespace: bijouterie  # nom du namespace
  labels:
    app: bijouterie   #nom de l'application
    tier: database  # regroupe les secrets liés à la base de données
type: Opaque   # type de secret, ici opaque pour stocker des données arbitraires
data:
  MYSQL_ROOT_PASSWORD: YWRtaW4=
  MYSQL_DATABASE: Ymlqb3V0ZXJpZQ==
  MYSQL_USER: YWRtaW4=
  MYSQL_PASSWORD: YWRtaW4=
